name: Daily ICP-MS intelligence update

on:
  schedule:
    # 19:00 UTC is 05:00 AEST / 06:00 AEDT in Melbourne.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and deduplicate public evidence
        run: python -m scripts.daily_update
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data/public_signals.csv data/update_status.json; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_signals.csv data/update_status.json
          git commit -m "data: daily ICP-MS intelligence update"
          git push
